[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuvis"
version = "3.5.3.3"
description = "CUVIS Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Cubert GmbH, Ulm, Germany", email = "sdk@cubert-gmbh.com" }
]

dependencies = [
    "cuvis-il>=3.5.0,<3.6.0",
    "setuptools; python_version>='3.12'"  # Only for Python 3.12+
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://www.cubert-hyperspectral.com/"
Repository = "https://github.com/cubert-hyperspectral/cuvis.python"
Documentation = "https://cubert-hyperspectral.github.io/cuvis.doc/"
Changelog = "https://github.com/cubert-hyperspectral/cuvis.python/releases"
Issues = "https://github.com/cubert-hyperspectral/cuvis.python/issues"

[tool.setuptools]
packages = ["cuvis"]
include-package-data = true

[tool.setuptools.package-data]
cuvis = ["git-hash.txt"]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.0.0",
]
dev = [
    "ruff==0.16.3",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces: the imports are the public API, not dead code.
"cuvis/__init__.py" = ["F401"]
"cuvis/_cuvis_il.py" = ["F401"]
# Dataclass fields that are shadowed by a property/setter pair further down.
"cuvis/FileWriteSettings.py" = ["F811"]
