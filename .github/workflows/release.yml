name: Release

# Pushing a vGENERATION.MAJOR.MINOR.PATCH tag on main releases that commit: sdist and wheel to
# TestPyPI, then PyPI, then a GitHub Release with the CHANGELOG.md section as notes.
# A pre-release tag (v3.6.0.0rc1) publishes to PyPI as a pre-release and creates no GitHub Release.
on:
  push:
    tags: ['v*.*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sdk: ${{ steps.meta.outputs.sdk }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      ruff: ${{ steps.pyproject.outputs.ruff }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Read pyproject.toml
        id: pyproject
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print(f"version={project['version']}")
          print("ruff=" + next(s for s in project["optional-dependencies"]["dev"] if s.startswith("ruff")))
          PY

      - id: meta
        uses: cubert-hyperspectral/cuvis.docker/.github/actions/release-meta@main
        with:
          version: ${{ steps.pyproject.outputs.version }}
          tag: ${{ github.ref_name }}

      - uses: cubert-hyperspectral/cuvis.docker/.github/actions/tag-on-main@main

      - uses: cubert-hyperspectral/cuvis.docker/.github/actions/changelog@main
        with:
          version: ${{ steps.meta.outputs.base_version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Verify the version is not published yet
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          version = os.environ["VERSION"]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/cuvis/json") as response:
                  released = json.load(response)["releases"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              released = {}

          if released.get(version):
              sys.exit(
                  f"cuvis=={version} is already on PyPI and cannot be replaced. "
                  "Bump PATCH, move the CHANGELOG.md section, and tag again."
              )
          print(f"cuvis=={version} is not published yet.")
          PY

      - name: Verify the cuvis_pyil image for this SDK exists
        env:
          IMAGE: cubertgmbh/cuvis_pyil:${{ steps.meta.outputs.sdk }}-ubuntu24.04
        run: |
          docker manifest inspect "$IMAGE" > /dev/null || {
            echo "${IMAGE} does not exist. Release cuvis.pyil for SDK ${{ steps.meta.outputs.sdk }} first."
            exit 1
          }

      - name: Install ruff
        run: python -m pip install "${{ steps.pyproject.outputs.ruff }}"

      - name: Check formatting and lint rules
        run: |
          ruff format --check .
          ruff check .

  tests:
    name: Tests
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: cubertgmbh/cuvis_pyil:${{ needs.validate.outputs.sdk }}-ubuntu24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the wrapper with test dependencies
        run: python3 -m pip install -e ".[test]"

      - name: Run tests
        run: python3 -m pytest

  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Record the commit hash in the package
        run: python prebuild.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: Verify the commit hash shipped in the wheel
        run: |
          python - <<'PY'
          import glob, subprocess, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          shipped = zipfile.ZipFile(wheel).read("cuvis/git-hash.txt").decode().strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert shipped == head, f"{wheel} carries {shipped}, expected {head}"
          print(f"{wheel} carries {shipped}")
          PY

      - name: List contents
        run: |
          ls -lh dist/
          tar tzf dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [validate, tests, build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Confirm the version is downloadable from TestPyPI
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python -m pip download --no-deps --dest /tmp/smoke \
                --index-url https://test.pypi.org/simple/ \
                "cuvis==${VERSION}"; then
              ls -lh /tmp/smoke
              exit 0
            fi
            echo "Not indexed yet, retrying in 30s (attempt ${attempt}/6)."
            sleep 30
          done
          echo "cuvis==${VERSION} never appeared on TestPyPI."
          exit 1

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.13.0

  github-release:
    name: Create GitHub release
    needs: [validate, publish-pypi]
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - id: notes
        uses: cubert-hyperspectral/cuvis.docker/.github/actions/changelog@main
        with:
          mode: extract
          version: ${{ needs.validate.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          name: cuvis ${{ needs.validate.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*
          draft: false
          prerelease: false
